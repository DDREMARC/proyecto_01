    <main class="container-fluid px-0 pt-5 mt-4">
        <!-- MAPA DE UBICACIÓN: mapa incrustado de Google Maps, como en el video. -->
        <section aria-label="Ubicación y formulario de contacto">
            <div class="mapa">
                <iframe title="Mapa de la Plaza de Armas de Lima" src="https://maps.google.com/maps?q=Plaza%20de%20Armas%20de%20Lima&t=&z=15&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
            </div>
            <div class="container contactos p-4">
                <div class="row">
                    <div class="col-lg-8"></div>
                    <div class="col-lg-4">
                <!-- FORMULARIO DE CONTACTO (Bootstrap): envía los datos a MySQL mediante envio.php. -->
                <div class="card"><div class="card-body">
                <form action="envio.php" method="post">
                    <div class="mb-3">
                        <label for="nombres" class="form-label">Apellidos y Nombres</label>
                        <input type="text" class="form-control" id="nombres" name="nombres" placeholder="Ingresa tus Nombres" maxlength="30" required>
                    </div>
                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ingresa tu Dirección" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="Ingresa tu Correo" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="comentarios" class="form-label">Comentarios</label>
                        <textarea class="form-control" id="comentarios" name="comentarios" rows="3" placeholder="Escribe tu comentario" required></textarea>
                    </div>
                    <button type="submit" class="form-control bg-dark text-white">Enviar</button>
                </form>
                </div></div>
                    </div>
                </div>
            </div>
        </section>
