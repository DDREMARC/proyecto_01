<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
    <title>Contactos | Academia Triunfadores</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- BOOTSTRAP CSS: estilos y diseño adaptable a teléfonos y computadoras. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- BOOTSTRAP ICONS: iconos de redes sociales del pie de página. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        .mapa iframe { width: 100%; height: 350px; border: 0; }
        .contactos { min-height: 350px; }
    </style>
</head>
<body>
    <!-- NAVBAR RESPONSIVE (Bootstrap): logo y secciones del sitio como en el video. -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="Academia Triunfadores" width="80"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse d-lg-flex justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contactos.html">Contactos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-0 pt-5 mt-4">
        <!-- MAPA DE UBICACIÓN: mapa incrustado de Google Maps, como en el video. -->
        <section class="row g-0 align-items-stretch" aria-label="Ubicación y formulario de contacto">
            <div class="col-lg-8 mapa">
                <iframe title="Mapa de la Plaza de Armas de Lima" src="https://maps.google.com/maps?q=Plaza%20de%20Armas%20de%20Lima&t=&z=15&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
            </div>
            <div class="col-lg-4 contactos p-4">
                <!-- FORMULARIO DE CONTACTO (Bootstrap): captura datos de ejemplo en esta página. -->
                <form action="">
                    <div class="mb-3">
                        <p>Apellidos y Nombres</p>
                        <input type="text" class="form-control" placeholder="Ingresa tus Nombres">
                    </div>
                    <div class="mb-3">
                        <p>Dirección</p>
                        <input type="text" class="form-control" placeholder="Ingresa tu Dirección">
                    </div>
                    <div class="mb-3">
                        <p>Correo</p>
                        <input type="email" class="form-control" placeholder="Ingresa tu Correo">
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <!-- REDES SOCIALES: iconos agregados al final de la página. -->
    <div class="social bg-dark py-5">
        <div class="redes text-white text-center" style="font-size:30px;">
            <i class="bi bi-facebook m-3"></i>
            <i class="bi bi-instagram m-3"></i>
            <i class="bi bi-youtube m-3"></i>
            <i class="bi bi-twitter m-3"></i>
        </div>
    </div>
    <!-- PIE DE PÁGINA: conserva el crédito solicitado por el autor. -->
    <footer class="py-3 bg-dark text-white text-center">
        <p class="mb-0">&copy; Angel Gabriel. Todos los derechos reservados.</p>
    </footer>

    <!-- BOOTSTRAP JS: activa el menú de navegación adaptable. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
