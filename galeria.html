<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
    <title>Galería | Los mejores animes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- BOOTSTRAP CSS: estilos base y componentes responsive. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    
    <!-- CSS PROPIO: reglas de la cuadrícula y la vista ampliada de la galería. -->
    <link href="css/galeria.css" rel="stylesheet" />
</head>
<body>
    
    <!-- NAVBAR RESPONSIVE (Bootstrap): navegación común del proyecto. -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo4.jpg" alt="Los mejores animes" width="80"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse d-lg-flex justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="mercancia.html">Mercancía</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Conoce más de nosotros</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="contacto.html">Contáctanos</a></li>
                            <li><a class="dropdown-item" href="redes-sociales.html">Redes sociales</a></li>
                            <li><a class="dropdown-item" href="libro-de-reclamaciones.html">Libro de reclamaciones</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="my-5 pt-5">
        <div class="container">
            <h1 class="text-center my-4">Nuestra galería de anime</h1>
            
            <!-- GALERÍA (estructura del video): miniaturas con clases Bootstrap y estilos propios. -->
            <section class="galeria-grid" aria-label="Imágenes de anime">
                <img src="img/banner01.jpg" alt="Banner de anime 1" class="img-galeria">
                <img src="img/banner02.jpg" alt="Banner de anime 2" class="img-galeria">
                <img src="img/banner03.jpg" alt="Banner de anime 3" class="img-galeria">
                <img src="img/imagen00.jpg" alt="Imagen de nuestro centro de anime" class="img-galeria">
                <img src="img/logo-imagen.jpg" alt="Logo del proyecto" class="img-galeria">
                <img src="img/logo4.jpg" alt="Logo de Los mejores animes" class="img-galeria">
                <img src="img/galeria-personaje-01.jpg" alt="Ilustración de personaje estilo anime" class="img-galeria">
                <img src="img/galeria-personaje-02.jpg" alt="Ilustración manga de estudiante" class="img-galeria">
            </section>
        </div>
    </main>
    
    <!-- VISTA AMPLIADA: modal de imagen inspirado en la interacción JQuery del video. -->
    <div class="img-modal" role="dialog" aria-modal="true" aria-label="Vista ampliada de la imagen">
        <button class="cerrar" type="button" aria-label="Cerrar imagen">&times;</button>
        <img src="" alt="">
    </div>
    <footer class="py-3"><div class="container text-center"><p class="mb-0">Todos los derechos reservados &copy;</p></div></footer>
    
    <!-- JQUERY: biblioteca usada para responder al clic en las miniaturas. -->
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    
    <!-- BOOTSTRAP JS: activa navbar y menú desplegable. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        $(function () {
            $('.img-galeria').on('click', function () {
                const imagen = $(this);
                $('.img-modal img').attr('src', imagen.attr('src')).attr('alt', imagen.attr('alt'));
                $('.img-modal').css('display', 'flex');
            });
            $('.cerrar, .img-modal').on('click', function (event) {
                if (event.target === this) $('.img-modal').hide();
            });
            $(document).on('keydown', function (event) {
                if (event.key === 'Escape') $('.img-modal').hide();
            });
        });
    </script>
</body>
</html>
