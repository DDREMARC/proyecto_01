<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
    <title>Galería | Academia Triunfadores</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- BOOTSTRAP CSS: estilos base y componentes responsive. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- CSS PROPIO: cuadrícula responsive y vista ampliada de la galería. -->
    <link href="css/galeria.css" rel="stylesheet" />
    <!-- ICONOS BOOTSTRAP: se cargan desde CDN para usar íconos en la galería. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



</head>

<body>
    <!-- NAVBAR RESPONSIVE (Bootstrap): navegación común del proyecto. -->
    <!-- NAVBAR RESPONSIVE (Bootstrap): logo y secciones del sitio como en el video. -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="Academia Triunfadores"
                    width="80"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Abrir navegación"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="galeria.html">Galería</a>
                    </li>
                    <!-- MENÚ DESPLEGABLE: opciones de información sobre los servicios. -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Servicios</a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="contactos.html">Contacto</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid pt-5">
        <h1 class="text-center my-5">Nuestra galería</h1>
        <!-- GALERÍA (estructura del video): siete miniaturas que se amplían al hacer clic. -->
        <section class="galeria-grid" aria-label="Galería de imágenes">
            <img src="galeria/img00.jpg" alt="Profesor escribiendo en una pizarra verde" class="img-galeria">
            <img src="galeria/img01.jpg" alt="Grupo de estudiantes compartiendo una actividad" class="img-galeria">
            <img src="galeria/img02.jpg" alt="Grupo de estudiantes en el aula" class="img-galeria">
            <img src="galeria/img03.jpg" alt="Dos estudiantes graduados" class="img-galeria">
            <img src="galeria/img04.jpg" alt="Estudiante trabajando frente a una computadora" class="img-galeria">
            <img src="galeria/img05.jpg" alt="Estudiantes participando en clase" class="img-galeria">
            <img src="galeria/img06.jpg" alt="Estudiante con libros en una biblioteca" class="img-galeria">
        </section>
    </main>
    <div class="social bg-dark py-5">
        <div class="redes text-white text-center" style="font-size:30px;">
            <i class="bi bi-facebook m-3"></i>
            <i class="bi bi-instagram m-3"></i>
            <i class="bi bi-youtube m-3"></i>
            <i class="bi bi-twitter m-3"></i>
        </div>
    </div>
    <!-- PIE DE PÁGINA: mantiene el nombre de autor del proyecto. -->
    <footer class="py-3 bg-dark text-white text-center">
        <div class="container">
            <p class="mb-0">&copy; Angel Gabriel. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- JQUERY: biblioteca usada para responder al clic en las miniaturas. -->
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script>
        $(function () {
            // Al hacer clic, crea y agrega al documento la vista ampliada de esa imagen.
            $('.img-galeria').on('click', function () {
                const imagen = this.src;
                const modelo = `<div class="modelo"><img src="${imagen}" alt="Imagen ampliada"><button class="cerrar" type="button" aria-label="Cerrar imagen">&times;</button></div>`;
                $('body, html').append(modelo);
            });
            // La X elimina del documento la imagen ampliada.
            $(document).on('click', '.cerrar', function () { $('.modelo').remove(); });
            // Escape oculta la imagen ampliada, como en el video.
            $('body').on('keyup', function (event) {
                if (event.which === 27) $('.modelo').hide();
            });
        });
    </script>
    <!-- BOOTSTRAP JS: activa navbar y menú desplegable. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
